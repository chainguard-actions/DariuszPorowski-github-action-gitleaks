name: Test source input (scan specific subdirectory)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source: "actions/hardened/DariuszPorowski--github-action-gitleaks/v2.0.8/tests"
          fail: "true"
          verbose: "true"
          log_level: "info"
          report_format: "json"
          redact: "true"
      - name: Assert exitcode is 0
        env:
          ACTUAL: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "actual exitcode: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exitcode 0, got $ACTUAL"
            exit 1
          fi
          echo "PASS"
      - name: Assert result contains SUCCESS
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual result: $ACTUAL"
          if [[ "$ACTUAL" != *"SUCCESS"* ]]; then
            echo "FAIL: expected result to contain SUCCESS"
            exit 1
          fi
          echo "PASS"
      - name: Assert command contains source path
        env:
          ACTUAL: ${{ steps.action.outputs.command }}
        run: |
          echo "actual command: $ACTUAL"
          if [[ "$ACTUAL" != *"tests"* ]]; then
            echo "FAIL: expected command to reference the source path"
            exit 1
          fi
          echo "PASS"
