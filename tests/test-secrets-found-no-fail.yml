name: Test secrets found with fail=false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare leaky source directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-leaky-nofail"
          printf 'API_KEY=GITLEAKS_TEST_SECRET_ABCDEF1234\n' > "$GITHUB_WORKSPACE/tmp-leaky-nofail/secret.txt"

      - id: scan
        uses: .
        continue-on-error: true
        with:
          source: tmp-leaky-nofail
          config: tests/fixtures/gitleaks-config.toml
          no_git: "true"
          fail: "false"
          report_format: json
          verbose: "true"
          log_level: info

      - name: Assert action step succeeded (fail=false means step exits 0 even with leaks)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXITCODE: ${{ steps.scan.outputs.exitcode }}
          RESULT: ${{ steps.scan.outputs.result }}
          COMMAND: ${{ steps.scan.outputs.command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exitcode: $EXITCODE"
          echo "result: $RESULT"
          echo "command: $COMMAND"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected step outcome 'success' with fail=false but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step succeeded as expected with fail=false"

      - name: Assert result output is set
        env:
          RESULT: ${{ steps.scan.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          echo "PASS: result is set: $RESULT"

      - name: Assert command output is set
        env:
          COMMAND: ${{ steps.scan.outputs.command }}
        run: |
          echo "command: $COMMAND"
          if [ -z "$COMMAND" ]; then
            echo "FAIL: command output is empty"
            exit 1
          fi
          echo "PASS: command is set"
