name: Test SARIF report format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        uses: .
        continue-on-error: true
        with:
          source: tests/fixtures/clean-source
          config: tests/fixtures/gitleaks-config.toml
          no_git: "true"
          fail: "true"
          report_format: sarif
          verbose: "false"
          log_level: info

      - name: Assert action succeeded (no leaks in clean source)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXITCODE: ${{ steps.scan.outputs.exitcode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exitcode: $EXITCODE"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed on clean source but got outcome '$OUTCOME'"
            exit 1
          fi
          if [ "$EXITCODE" != "0" ]; then
            echo "FAIL: expected exitcode 0 but got '$EXITCODE'"
            exit 1
          fi
          echo "PASS: action succeeded with exitcode 0"

      - name: Assert report output ends with .sarif
        env:
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          echo "report: $REPORT"
          if echo "$REPORT" | grep -q "\.sarif"; then
            echo "PASS: report file has .sarif extension"
          else
            echo "FAIL: expected .sarif extension in report path but got: $REPORT"
            exit 1
          fi

      - name: Assert result indicates success
        env:
          RESULT: ${{ steps.scan.outputs.result }}
        run: |
          echo "result: $RESULT"
          if echo "$RESULT" | grep -qi "SUCCESS"; then
            echo "PASS: result indicates success"
          else
            echo "FAIL: expected SUCCESS in result but got: $RESULT"
            exit 1
          fi
