name: Test no_git input (scan as plain directory)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a plain directory to scan (no git history)
        run: |
          mkdir -p /tmp/plain-scan-dir
          echo "# Safe file with no secrets" > /tmp/plain-scan-dir/README.md
          echo "hello=world" > /tmp/plain-scan-dir/config.txt
      - id: action
        uses: .
        with:
          source: "/tmp/plain-scan-dir"
          no_git: "true"
          fail: "true"
          verbose: "true"
          log_level: "info"
          report_format: "json"
          redact: "true"
      - name: Assert exitcode is 0
        env:
          ACTUAL: ${{ steps.action.outputs.exitcode }}
        run: |
          echo "actual exitcode: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exitcode 0, got $ACTUAL"
            exit 1
          fi
          echo "PASS"
      - name: Assert result contains SUCCESS
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual result: $ACTUAL"
          if [[ "$ACTUAL" != *"SUCCESS"* ]]; then
            echo "FAIL: expected result to contain SUCCESS"
            exit 1
          fi
          echo "PASS"
      - name: Assert command contains no-git flag
        env:
          ACTUAL: ${{ steps.action.outputs.command }}
        run: |
          echo "actual command: $ACTUAL"
          if [[ "$ACTUAL" != *"--no-git"* ]]; then
            echo "FAIL: expected command to contain --no-git flag"
            exit 1
          fi
          echo "PASS"
