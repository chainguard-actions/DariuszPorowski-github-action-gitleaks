name: Test baseline_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a directory with a file containing a fake secret pattern
      - name: Set up test source with a fake secret
        run: |
          mkdir -p /tmp/gitleaks-test-source
          # Write a file with a pattern that gitleaks would flag
          cat > /tmp/gitleaks-test-source/config.env << 'EOF'
          GITHUB_TOKEN=ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EOF

      # First, run gitleaks with no_git and fail=false to generate a baseline report
      - name: Generate baseline report
        id: gen_baseline
        uses: .
        with:
          source: /tmp/gitleaks-test-source
          no_git: "true"
          fail: "false"
          report_format: "json"
          verbose: "true"
          log_level: "info"

      - name: Show baseline report path
        env:
          REPORT: ${{ steps.gen_baseline.outputs.report }}
          EXITCODE: ${{ steps.gen_baseline.outputs.exitcode }}
        run: |
          echo "baseline report: $REPORT"
          echo "exitcode: $EXITCODE"

      # Now run with the baseline so findings are suppressed
      - name: Run scan with baseline_path
        id: action
        uses: .
        with:
          source: /tmp/gitleaks-test-source
          no_git: "true"
          fail: "false"
          baseline_path: ${{ steps.gen_baseline.outputs.report }}
          report_format: "json"
          verbose: "true"
          log_level: "info"

      - name: Assert outputs are set
        env:
          EXITCODE: ${{ steps.action.outputs.exitcode }}
          RESULT: ${{ steps.action.outputs.result }}
          COMMAND: ${{ steps.action.outputs.command }}
        run: |
          echo "exitcode: $EXITCODE"
          echo "result: $RESULT"
          echo "command: $COMMAND"
          if [ -z "$COMMAND" ]; then
            echo "FAIL: command output is empty"
            exit 1
          fi
          if echo "$COMMAND" | grep -q "baseline"; then
            echo "PASS: baseline_path was included in the gitleaks command"
          else
            echo "FAIL: baseline_path was not reflected in the gitleaks command: $COMMAND"
            exit 1
          fi
          echo "PASS: baseline_path input exercised successfully"
