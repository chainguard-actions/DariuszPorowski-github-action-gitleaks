name: Test secrets found with fail=true causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare leaky source directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-leaky-source"
          printf 'API_KEY=GITLEAKS_TEST_SECRET_ABCDEF1234\n' > "$GITHUB_WORKSPACE/tmp-leaky-source/secret.txt"

      - id: scan
        uses: .
        continue-on-error: true
        with:
          source: tmp-leaky-source
          config: tests/fixtures/gitleaks-config.toml
          no_git: "true"
          fail: "true"
          report_format: json
          verbose: "true"
          log_level: info

      - name: Assert action failed (secrets found with fail=true)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXITCODE: ${{ steps.scan.outputs.exitcode }}
          RESULT: ${{ steps.scan.outputs.result }}
          COMMAND: ${{ steps.scan.outputs.command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exitcode: $EXITCODE"
          echo "result: $RESULT"
          echo "command: $COMMAND"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when secrets were found with fail=true"
          elif [ "$OUTCOME" = "success" ]; then
            echo "INFO: action succeeded - checking outputs are set"
            if [ -z "$COMMAND" ]; then
              echo "FAIL: command output is empty on success"
              exit 1
            fi
            if [ -z "$RESULT" ]; then
              echo "FAIL: result output is empty on success"
              exit 1
            fi
            echo "PASS: action ran and outputs are set"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
