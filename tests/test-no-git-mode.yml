name: Test no_git mode scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a clean source directory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          echo "# Hello World" > "$GITHUB_WORKSPACE/scan-target/README.md"
          echo "name: test-project" > "$GITHUB_WORKSPACE/scan-target/config.yaml"

      - id: gitleaks
        uses: .
        with:
          source: "scan-target"
          no_git: "true"
          fail: "false"
          verbose: "true"
          log_level: "info"

      - name: Assert outputs are set
        env:
          EXITCODE: ${{ steps.gitleaks.outputs.exitcode }}
          RESULT: ${{ steps.gitleaks.outputs.result }}
          COMMAND: ${{ steps.gitleaks.outputs.command }}
          REPORT: ${{ steps.gitleaks.outputs.report }}
        run: |
          echo "exitcode: $EXITCODE"
          echo "result: $RESULT"
          echo "command: $COMMAND"
          echo "report: $REPORT"

          if [ -z "$EXITCODE" ]; then
            echo "FAIL: exitcode output is empty"
            exit 1
          fi
          echo "PASS: exitcode is '$EXITCODE'"

          if [ -z "$COMMAND" ]; then
            echo "FAIL: command output is empty"
            exit 1
          fi
          echo "PASS: command is set"

          # Verify --no-git flag appears in the command
          if echo "$COMMAND" | grep -q "\-\-no-git"; then
            echo "PASS: --no-git flag is present in command"
          else
            echo "FAIL: --no-git flag not found in command: $COMMAND"
            exit 1
          fi

          if [ -z "$REPORT" ]; then
            echo "FAIL: report output is empty"
            exit 1
          fi
          echo "PASS: report is '$REPORT'"

      - name: Assert exitcode is valid
        env:
          EXITCODE: ${{ steps.gitleaks.outputs.exitcode }}
        run: |
          echo "exitcode: $EXITCODE"
          if [ "$EXITCODE" = "0" ] || [ "$EXITCODE" = "1" ]; then
            echo "PASS: gitleaks ran successfully with exitcode=$EXITCODE"
          else
            echo "FAIL: unexpected exitcode '$EXITCODE'"
            exit 1
          fi
