name: Test no_git mode scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean source directory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          echo "# Hello World" > "$GITHUB_WORKSPACE/scan-target/README.md"
          echo "name: test-project" > "$GITHUB_WORKSPACE/scan-target/config.yaml"

      - id: gitleaks
        uses: .
        with:
          source: "scan-target"
          no_git: "true"
          fail: "false"
          verbose: "true"
          log_level: "info"
          report_format: "json"

      - name: Assert exitcode output is set
        env:
          EXITCODE: ${{ steps.gitleaks.outputs.exitcode }}
        run: |
          echo "exitcode: $EXITCODE"
          if [ -z "$EXITCODE" ]; then
            echo "FAIL: exitcode output is empty"
            exit 1
          fi
          echo "PASS: exitcode is '$EXITCODE'"

      - name: Assert result output is set
        env:
          RESULT: ${{ steps.gitleaks.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty"
            exit 1
          fi
          echo "PASS: result is '$RESULT'"

      - name: Assert command output is set
        env:
          COMMAND: ${{ steps.gitleaks.outputs.command }}
        run: |
          echo "command: $COMMAND"
          if [ -z "$COMMAND" ]; then
            echo "FAIL: command output is empty"
            exit 1
          fi
          if echo "$COMMAND" | grep -q "no-git"; then
            echo "PASS: command contains 'no-git' flag"
          else
            echo "FAIL: expected command to contain 'no-git' flag, got: $COMMAND"
            exit 1
          fi
